name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Offline tests (no network, no model calls)
        run: python3 tests/run.py -v
      - name: Skill folders match scripts/ and references/
        run: python3 tools/sync.py --check

  skills-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install skills-ref at a pinned commit
        run: pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate the three skills
        run: for d in skills/*/; do skills-ref validate "$d"; done
      - name: Every SKILL.md under 500 lines
        run: for f in skills/*/SKILL.md; do n=$(wc -l < "$f"); echo "$f $n"; test "$n" -lt 500; done
