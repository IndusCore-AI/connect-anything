<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Icon</title>
<style>
:root { --bg: #15181d; --line: #ffffff; --join: #6ea8ff; }
html, body { margin: 0; overflow-x: clip; background: transparent; }
main { width: 512px; height: 512px; background: var(--bg); border-radius: 112px; display: grid; place-items: center; }
svg { width: 320px; height: 320px; }
</style></head>
<body><main>
<svg viewBox="0 0 100 100" role="img" aria-label="Three lines joining into one">
  <path d="M10 22 C 40 22, 46 50, 62 50" fill="none" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/>
  <path d="M10 50 L 62 50" fill="none" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/>
  <path d="M10 78 C 40 78, 46 50, 62 50" fill="none" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/>
  <path d="M62 50 L 90 50" fill="none" stroke="var(--join)" stroke-width="9" stroke-linecap="round"/>
</svg>
</main></body></html>
